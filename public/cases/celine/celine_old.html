<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celine</title>
    <link rel="stylesheet" href="./reset.css">

</head>
<style>
    body{
        width: 100%;
        height: 100vh;
        overflow: hidden;
    }
    #framewrap{
        width:100%;
        margin: auto;
        height: calc(100% - 60px);
        transition: 1s;
    }

    #framewrap.desk{
        width: 100%;
    }

    #framewrap.tablet{
        width: 945px;
    }

    #framewrap.mobile{
        width: 580px;
    }

    iframe{
        width: 100%;
        height: 100%;
    }
    header{
        width: 100%;
        height: 60px;
        background: #fafafa;
        border-bottom: 1px solid #eeeeee;
    }

    header ul{
        display: flex;
        justify-content: center;
    }

    header ul li a{
        display: block;
        font-size: 35px;
        color: #525252;
        margin: 5px 20px;
    }
    img{
        width: 30px;
    }


</style>
</head>
<body>
<header>
    <ul>
        <li><a href="./in.html" class="deskB"><img src="./img/monitor.png" alt=""></a></li>
        <li><a href="./in.html" class="tabletB"><img src="./img/tabelet.png" alt=""></a></li>
        <li><a href="./in.html" class="mobileB"><img src="./img/mobile.png" alt=""></a></li>
    </ul>
</header>
<div id="framewrap">
    <iframe src="./in.html" frameborder="0"></iframe>
</div>
<script src="./js/jquery-3.5.1.js"></script>
<script>
    $('a.deskB').click(function(e){
        e.preventDefault()
        $('#framewrap').removeClass()
        $('#framewrap').addClass('desk')
    })
    $('a.tabletB').click(function(e){
        e.preventDefault()
        $('#framewrap').removeClass()
        $('#framewrap').addClass('tablet')
    })
    $('a.mobileB').click(function(e){
        e.preventDefault()
        $('#framewrap').removeClass()
        $('#framewrap').addClass('mobile')
    })
</script>

</body>
</html>
