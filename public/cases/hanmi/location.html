<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오시는 길 — 한미반도체</title>
<meta name="description" content="한미반도체 본사(인천광역시 서해구 가좌로 30번길 14)와 서울사무소 오시는 길 안내.">
<meta name="theme-color" content="#05070c">
<meta property="og:title" content="오시는 길 — 한미반도체">
<meta property="og:description" content="한미반도체 본사(인천광역시 서해구 가좌로 30번길 14)와 서울사무소 오시는 길 안내.">
<meta property="og:image" content="img/news-ir.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230062d6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/hanmi.css">
<link rel="stylesheet" href="css/pages.css">
<script src="js/layout.js" defer></script>
</head>
<body data-section="brand" data-page="location">

<main id="main">
  <section class="sec sec--pb140">
    <div class="wrap">
      <div class="head-l head-l--48 rv">
        <p class="eyebrow eyebrow--primary">LOCATION</p>
        <h2 class="t-h2">오시는 길</h2>
      </div>
      <div class="map rv" role="img" aria-label="한미반도체 본사 위치 지도 영역">
        <img src="img/icon-pin.svg" width="48" height="48" alt="">
        <span class="map__label">한미반도체 본사</span>
      </div>
      <dl class="info-tbl rv">
        <div><dt>본사</dt><dd id="addr-hq">인천광역시 서해구 가좌로 30번길 14</dd></div>
        <div><dt>서울사무소</dt><dd>서울특별시 용산구 한남대로 152</dd></div>
        <div><dt>대표번호</dt><dd><a href="tel:+82325719100">+82-32-571-9100</a></dd></div>
        <div><dt>A/S 콜센터</dt><dd><a href="tel:+82325711119">+82-32-571-1119</a>  (365일 24시간)</dd></div>
      </dl>
      <div class="btn-row loc-actions">
        <a class="btn btn--primary" href="https://map.naver.com/p/search/%EC%9D%B8%EC%B2%9C%EA%B4%91%EC%97%AD%EC%8B%9C%20%EA%B0%80%EC%A2%8C%EB%A1%9C%2030%EB%B2%88%EA%B8%B8%2014" target="_blank" rel="noopener">길찾기 <img src="img/icon-arrow-white.svg" width="18" height="18" alt=""><span class="sr-only">(새 창)</span></a>
        <button class="btn btn--outline" type="button" id="copy-addr">주소 복사 <img src="img/icon-arrow-dark.svg" width="18" height="18" alt=""></button>
        <p class="copy-msg t-small" role="status" aria-live="polite"></p>
      </div>
    </div>
  </section>
  <script>
    document.getElementById('copy-addr').addEventListener('click', async () => {
      const msg = document.querySelector('.copy-msg');
      const text = document.getElementById('addr-hq').textContent;
      try { await navigator.clipboard.writeText(text); msg.textContent = '주소가 복사되었습니다.'; }
      catch { msg.textContent = text; }
      setTimeout(() => { msg.textContent = ''; }, 2500);
    });
  </script>
</main>
</body>
</html>
