<body data-section="brand" data-page="policy">

<main id="main">
  <section class="sec sec--pb140">
    <div class="wrap stack-64">
      <div class="head-c rv">
        <p class="eyebrow eyebrow--primary">CUSTOMER POLICY</p>
        <h2 class="t-h2">한미반도체 고객 정책</h2>
        <p class="t-body-l c-sub">고객만족과 고객평등, 한미반도체가 모든 고객과 지켜가는 두 가지 약속입니다.</p>
      </div>
      <img class="wide-img wide-img--420 rv" src="img/policy.png" alt="비즈니스 파트너가 악수하는 모습" width="1760" height="720" loading="lazy">
      <div class="grid-2">
        <article class="pcard rv">
          <b class="pcard__no">01</b>
          <p class="eyebrow eyebrow--sub">CUSTOMER SATISFACTION</p>
          <h3 class="t-h2">고객 만족</h3>
          <p class="t-body-l c-sub">고객이 제품과 서비스를 통해 기대를 초과하는 만족을 얻는 것을 의미합니다.</p>
        </article>
        <article class="pcard rv">
          <b class="pcard__no">02</b>
          <p class="eyebrow eyebrow--sub">CUSTOMER EQUALITARIANISM</p>
          <h3 class="t-h2">고객 평등</h3>
          <p class="t-body-l c-sub">모든 고객을 동등하게 대우하는 철학이나 정책을 의미합니다. 고객 간 서열이나 우선순위를 두지 않고, 모든 고객을 동일하게 존중합니다.</p>
        </article>
      </div>
    </div>
