<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Preview — Kate</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
  <!--
    Universal project viewer.
    /preview.html?url=/cases/feev/index.html&view=mobile|tablet|pc
    Any project page opens inside the frame; the device bar stays on top while
    you click around inside the project. Only paths under /cases/ are allowed.
  -->
  <style>
    :root {
      --bg: #0c0c0d;
      --stage: #141416;
      --ink: #ededeb;
      --mute: #8a8a88;
      --pill: #1c1c1e;
      --pill-h: #262628;
      --line: #232325;
      --blue-ink: #4f57eb;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --bar: 60px;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font: 500 13px/1.2 "Geist", "Noto Sans KR", system-ui, sans-serif;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--blue-ink); outline-offset: 2px; }

    /* ---------- bar ---------- */
    .bar {
      flex: none;
      height: var(--bar);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .bar__l { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .bar__r { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .title {
      color: var(--mute); font-weight: 400;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .devices {
      display: inline-flex; gap: 2px; padding: 3px;
      border-radius: 999px; background: var(--pill);
    }
    .devices button {
      display: inline-flex; align-items: center; gap: 7px;
      height: 34px; padding: 0 16px; border-radius: 999px;
      color: var(--mute);
      transition: background .3s var(--ease), color .3s var(--ease);
    }
    .devices button:hover { color: var(--ink); }
    .devices button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .devices svg { width: 16px; height: 16px; flex: none; }

    .size { color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 400; white-space: nowrap; }
    .newtab {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); white-space: nowrap;
      transition: border-color .3s var(--ease);
    }
    .newtab:hover { border-color: var(--mute); }

    /* ---------- stage ---------- */
    .stage {
      flex: 1; min-height: 0;
      display: flex; justify-content: center; align-items: flex-start;
      background: var(--stage);
      overflow: auto;
    }
    .frame {
      width: 100%; height: 100%;
      background: #fff;
      transition: width .6s var(--ease), height .6s var(--ease), margin .6s var(--ease), border-radius .6s var(--ease);
      overflow: hidden;
      flex: none;
    }
    .frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    body[data-view="mobile"] .frame,
    body[data-view="tablet"] .frame {
      margin: 24px 0;
      height: calc(100% - 48px);
      border-radius: 18px;
      box-shadow: 0 0 0 1px #2a2a2d, 0 30px 80px rgba(0, 0, 0, .5);
    }
    body[data-view="mobile"] .frame { width: 390px; max-height: 844px; border-radius: 28px; }
    body[data-view="tablet"] .frame { width: 820px; max-height: 1180px; }

    .error {
      margin: auto; max-width: 420px; padding: 24px; text-align: center;
      color: var(--mute); font-weight: 400; line-height: 1.5;
    }
    .error a { color: var(--ink); text-decoration: underline; }

    /* narrow screens: the visitor's own device is the preview — hide the switch */
    @media (max-width: 860px) {
      .size, .newtab span.l { display: none; }
      .bar { grid-template-columns: 1fr auto; padding: 0 12px; }
      .devices { display: none; }
      body[data-view] .frame { width: 100%; height: 100%; max-height: none; margin: 0; border-radius: 0; box-shadow: none; }
    }
    @media (max-width: 1100px) and (min-width: 861px) {
      .devices button span { display: none; }
      .devices button { padding: 0 12px; }
      .title { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame { transition: none; }
    }
  </style>
</head>
<body data-view="pc">
  <header class="bar">
    <div class="bar__l">
      <span class="title" id="title"></span>
    </div>

    <div class="devices" role="group" aria-label="Device">
      <button type="button" data-view="pc" aria-pressed="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2"/><path d="M5.5 14h5M8 11v3"/></svg>
        <span>PC</span>
      </button>
      <button type="button" data-view="tablet" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="13" rx="1.6"/><path d="M7 12.2h2"/></svg>
        <span>Tablet</span>
      </button>
      <button type="button" data-view="mobile" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="1.5" width="8" height="13" rx="1.6"/><path d="M7 12.2h2"/></svg>
        <span>Mobile</span>
      </button>
    </div>

    <div class="bar__r">
      <span class="size" id="size"></span>
      <a class="newtab" id="newtab" href="#" target="_blank" rel="noopener"><span class="l" data-t="newtab">새 탭</span> <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="frame" id="frame"></div>
  </main>

  <script>
    (function () {
      var T = {
        ko: { newtab: "새 탭", bad: "프로젝트를 찾을 수 없습니다.", home: "포트폴리오로 돌아가기" },
        en: { newtab: "New tab", bad: "This project could not be found.", home: "Back to the portfolio" },
      };
      var params = new URLSearchParams(location.search);
      var lang = params.get("lang");
      try { lang = lang || localStorage.getItem("lang"); } catch (e) {}
      if (lang !== "en") lang = "ko";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[lang][el.dataset.t]; });

      // the site may live in a sub-folder (GitHub Pages: /kate.portfolio/); "url" is relative to it
      var BASE = location.pathname.replace(/[^/]*$/, "");
      var full = function (p) { return BASE + p.replace(/^\//, ""); };

      // only the portfolio's own project pages
      var src = params.get("url") || "";
      var ok = /^\/cases\/[^?#]*$/.test(src.split(/[?#]/)[0]) && src.indexOf("..") === -1;
      var frame = document.getElementById("frame");
      var titleEl = document.getElementById("title");
      var sizeEl = document.getElementById("size");
      var newtab = document.getElementById("newtab");

      if (!ok) {
        frame.outerHTML = '<p class="error">' + T[lang].bad + '<br><a href="' + BASE + '#work">' + T[lang].home + "</a></p>";
        document.querySelector(".devices").style.display = "none";
        newtab.style.display = "none";
        return;
      }

      var iframe = document.createElement("iframe");
      iframe.title = "Project preview";
      iframe.src = full(src);
      frame.appendChild(iframe);
      newtab.href = full(src);

      // ----- device switch -----
      var SIZES = { mobile: [390, 844], tablet: [820, 1180] };
      var view = params.get("view");
      if (!/^(mobile|tablet|pc)$/.test(view || "")) {
        try { view = localStorage.getItem("preview-view"); } catch (e) {}
      }
      if (!/^(mobile|tablet|pc)$/.test(view || "")) view = "pc";

      function showSize() {
        sizeEl.textContent = iframe.clientWidth + " × " + iframe.clientHeight;
      }
      function setView(v, save) {
        view = v;
        document.body.dataset.view = v;
        document.querySelectorAll(".devices button").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.dataset.view === v));
        });
        if (save) {
          try { localStorage.setItem("preview-view", v); } catch (e) {}
          syncUrl();
        }
        setTimeout(showSize, 650);
      }
      document.querySelectorAll(".devices button").forEach(function (b) {
        b.addEventListener("click", function () { setView(b.dataset.view, true); });
      });
      addEventListener("resize", showSize);
      new ResizeObserver(showSize).observe(iframe);

      // ----- keep the bar in sync while you browse inside the project -----
      function current() {
        try {
          var l = iframe.contentWindow.location;
          if (l.origin === location.origin && l.pathname.indexOf(BASE + "cases/") === 0) return "/" + l.pathname.slice(BASE.length) + l.search + l.hash;
        } catch (e) {}
        return null;
      }
      function syncUrl() {
        var path = current() || src;
        var q = new URLSearchParams(location.search);
        q.set("url", decodeURI(path));
        q.set("view", view);
        history.replaceState(null, "", location.pathname + "?" + q.toString());
        newtab.href = full(path);
      }
      iframe.addEventListener("load", function () {
        var t = "";
        try { t = iframe.contentDocument.title; } catch (e) {}
        titleEl.textContent = t;
        document.title = (t ? t + " — " : "") + "Preview";
        syncUrl();
        showSize();
      });

      setView(view, false);
    })();
  </script>
</body>
</html>
