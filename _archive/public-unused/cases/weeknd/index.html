<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weeknd</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>
 
    <div class="night">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
     
      </div>
<header></header>
    <span class="mainVisual">
        <img src="./img/week.png" alt="">
    </span>
    <main>

        <div class="mySwiper1">
            <video src="./img/videoplayback (1).mp4" autoplay muted loop></video>
        </div>
        <div class="btn">
            <a href="#" class="benefits btn-15 button">Tickets</a>
            <a href="#" class="attraction  btn-15 button">Information</a>
        </div>

    </main>
    <div class="stage1">
      
        <span class="top"></span>
        <span class="right"></span>
        <span class="bottom"></span>
        <span class="left"></span>
    <a href="#" class="close"><img src="./img/white.png" alt=""></a>
 
        <img src="img/weektickets.jpg" alt="">
    </div>
    <div class="stage2">
        
        <a href="#" class="close"><img src="./img/white.png" alt=""></a>
        <img src="img/poster2.webp" alt="">
       
        
    </div>
    <div class="img_block">

    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  
    <script>
        
        ////////////main  aniamtion----------

        function mainHide(){
            $('.mySwiper1').animate({'top':'-300px', 'opacity':'0'});
            $('.btn').delay(200).animate({'bottom':'-140px', 'opacity':'0'});
            $('.mainVisual').delay(400).animate({'right':'-100px', 'opacity':'1'});
        }
        function mainShow(){
            $('.mySwiper1').animate({'top':'0', 'opacity':'1'});
            $('.btn').delay(200).animate({'bottom':'0', 'opacity':'1'});
            $('.mainVisual').delay(400).animate({'right':'0', 'opacity':'1'});
        }




        $('a.benefits').click(function(){
         
            $('.stage1 img, .img_block').fadeIn(1000);
            $('.stage1 span').fadeIn()
            mainHide()
        })
        $('a.attraction').click(function(){
            $('.stage2, .img_block').fadeIn(1000);
            mainHide()
        })
      
        
        $('.stage1 a.close').click(function(){
            $('.stage1 img, .stage1 span, .img_block').fadeOut(500);
            mainShow()
          
        });
        $('.stage2').click(function(){
            $('.stage2, stage2 span, .img_block').fadeOut(500);
            mainShow()
        })



        $('.top').animate({'width':'100%'},1500, function(){

     
        $('.right').animate({'height':'100%'},1500, function(){


        $('.bottom').animate({'width':'100%'},1500, function(){


        $('.left').animate({'height':'100%'},1500, function(){

        })
    })
})
})

    </script>
</body>

</html>
