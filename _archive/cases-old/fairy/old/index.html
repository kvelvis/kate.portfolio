    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.1/ScrollToPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script> 
    <script src="./splitText.js"></script>
    <script>
 const horizontal = document.querySelector('#h-slide')
 let sections = gsap.utils.toArray('#h-slide>section')

 let scrollTween = gsap.to(sections, {
    xPercent:-100*(sections.length -1 ),
    ease:'none',
    scrollTrigger:{
        trigger:horizontal,
        start:'top top',
        end:()=>'+='+(horizontal.offsetWidth - innerWidth),
        pin:true,
        scrub:1,
        invalidateOnRefresh: true,
    }
 })
 //------------------------------------------smooth scroll
 const lenis = new Lenis()
 function raf(time){
    lenis.raf(time)
    requestAnimationFrame(raf)
 }
 requestAnimationFrame(raf)

 const imageElements = gsap.utils.toArray('#h-slide .item_img img')
 imageElements.forEach(function(imgBox){
    gsap.timeline({
        scrollTrigger:{
            trigger:imgBox,
            containerAnimation: scrollTween, // on the top function conection
            start:'center right',
            end:'center center',
            scrub:true

        }
    })
    .to(imgBox,{'clip-path':'inset(0%)', ease:'none', duration:3},0)
     gsap.timeline({
        scrollTrigger:{
            trigger:imgBox,
            containerAnimation: scrollTween, // on the top function conection
            start:'center right',
            end:'center left',
            scrub:true

        }
    })
    .to(imgBox,{'clip-path':'inset(10%)', ease:'none', duration:3},3)
 })
 // text
 gsap.utils.toArray('.item').forEach(item=>{
        const bgColor= item.getAttribute('data-bgcolor')
        gsap.to('body',{
            scrollTrigger:{
                trigger:item,
                start:'bottom 50%', 
                end:'top 50%',
                onEnter:()=>gsap.to('body',{backgroundColor:bgColor, duration:1.5}),
                onEnterBack:()=>gsap.to('body',{backgroundColor:bgColor, duration:2}),
                toggleActions:'restart none none none'
            }
        })

        const itemTitle = item.querySelector('.item_title')
        if(itemTitle){
            const {chars, words}=new SplitText(itemTitle,{
                type:'words, chars'

            })
            words.forEach((word,i)=>{
                if(i%2 === 0){
                    gsap.set(word,{color:'#fff'})
                }else{
                    gsap.set(word,{color:'skyblue'}),
                    gsap.set(word,{textShadow:'2px 1px 2px purple'})
                }
            })
            gsap.to(chars,{
                y:-100,
                opacity:1,
                duration:3,
                stagger:{
                    each:0.5, 
                    from:'random'
                },
                scrollTrigger:{
                    trigger:itemTitle,
                    start:'center center',
                    end:'center center',
                    scrub:2,
                    
                }
            })
        }
       })
    </script>
